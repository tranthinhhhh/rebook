<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Đặt lại mật khẩu</title></head>
<body>
<div layout:fragment="content" class="container rb-auth">
    <div class="row justify-content-center w-100 mx-0">
        <div class="col-md-7 col-lg-5">
            <div class="rb-card shadow-sm">
                <h1 class="h4 text-center">Đặt lại mật khẩu</h1>
                <p class="text-muted text-center">Mã OTP đã được gửi tới <strong th:text="${form.email}"></strong></p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form th:action="@{/auth/reset}" th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:field="*{email}">
                    <div class="mb-3">
                        <label class="form-label">Mã OTP</label>
                        <input type="text" class="form-control rb-otp-input" th:field="*{otp}" maxlength="6" inputmode="numeric" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{otp}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{newPassword}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('passwordMatched')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{passwordMatched}"></div>
                    </div>
                    <button class="btn btn-primary w-100 py-2" type="submit">Đặt lại mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
