<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Quên mật khẩu</title></head>
<body>
<div layout:fragment="content" class="container rb-auth">
    <div class="row justify-content-center w-100 mx-0">
        <div class="col-md-7 col-lg-5">
            <div class="rb-card shadow-sm">
                <h1 class="h4 text-center">Quên mật khẩu</h1>
                <p class="text-muted text-center">Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP để đặt lại mật khẩu.</p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form th:action="@{/auth/forgot}" method="post">
                    <input type="email" name="email" class="form-control mb-3" th:value="${email}" placeholder="ban@email.com" required autofocus>
                    <button class="btn btn-primary w-100 py-2" type="submit">Gửi mã OTP</button>
                </form>
                <p class="text-center mt-3 mb-0"><a th:href="@{/auth/login}"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
