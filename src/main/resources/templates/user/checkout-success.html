<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Đặt hàng thành công</title></head>
<body>
<div layout:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="rb-card p-4 text-center">
                <th:block th:if="${!#lists.isEmpty(orders) and orders[0].status.name() != 'CANCELLED'}">
                    <div class="display-4 text-success"><i class="bi bi-check-circle"></i></div>
                    <h1 class="h3">Đặt hàng thành công!</h1>
                    <p class="text-muted">Cảm ơn bạn đã mua sách tại ReBook. Cửa hàng sẽ xác nhận đơn trong thời gian sớm nhất.</p>
                </th:block>
                <th:block th:if="${!#lists.isEmpty(orders) and orders[0].status.name() == 'CANCELLED'}">
                    <div class="display-4 text-danger"><i class="bi bi-x-circle"></i></div>
                    <h1 class="h3">Thanh toán không thành công</h1>
                    <p class="text-muted">Đơn hàng đã được hủy, sách đã được hoàn về kho.</p>
                </th:block>
                <table class="table text-start mt-3">
                    <thead><tr><th>Mã đơn</th><th>Cửa hàng</th><th>Thanh toán</th><th class="text-end">Tổng</th></tr></thead>
                    <tbody>
                    <tr th:each="o : ${orders}">
                        <td><a th:href="@{/user/orders/{id}(id=${o.id})}" th:text="'#' + ${o.code}"></a></td>
                        <td th:text="${o.store.name}"></td>
                        <td><span th:text="${o.paymentMethod.name()}"></span> · <small th:text="${o.paymentStatus.label}"></small></td>
                        <td class="text-end fw-semibold" th:text="${@fmt.money(o.total)}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="d-flex gap-2 justify-content-center">
                    <a th:href="@{/user/orders}" class="btn btn-primary">Xem đơn mua</a>
                    <a th:href="@{/}" class="btn btn-outline-primary">Tiếp tục mua sắm</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
