<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Địa chỉ nhận hàng</title></head>
<body>
<div layout:fragment="content" class="container">
    <div class="row g-4">
        <div class="col-lg-3"><div th:replace="~{fragments/user-nav :: nav}"></div></div>
        <div class="col-lg-9">
            <div class="rb-card p-4 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="h5 mb-0">Địa chỉ nhận hàng</h1>
                    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#addrForm"><i class="bi bi-plus"></i> Thêm địa chỉ</button>
                </div>
                <div class="collapse" id="addrForm" th:classappend="${showForm == true or addressForm.id != null} ? 'show'">
                    <form th:action="@{/user/addresses}" th:object="${addressForm}" method="post" class="border rounded-3 p-3 mb-3 bg-light" novalidate>
                        <input type="hidden" th:field="*{id}">
                        <h2 class="h6" th:text="*{id} != null ? 'Sửa địa chỉ' : 'Địa chỉ mới'"></h2>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small">Tên người nhận</label>
                                <input class="form-control" th:field="*{receiverName}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{receiverName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Số điện thoại</label>
                                <input class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Số nhà, tên đường</label>
                                <input class="form-control" th:field="*{detail}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{detail}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Phường/Xã</label>
                                <input class="form-control" th:field="*{ward}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{ward}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Quận/Huyện</label>
                                <input class="form-control" th:field="*{district}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{district}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Tỉnh/Thành phố</label>
                                <input class="form-control" th:field="*{province}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{province}"></div>
                            </div>
                            <div class="col-12 form-check ms-2">
                                <input class="form-check-input" type="checkbox" th:field="*{defaultAddress}" id="defAddr">
                                <label class="form-check-label small" for="defAddr">Đặt làm địa chỉ mặc định</label>
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button class="btn btn-primary" type="submit">Lưu địa chỉ</button>
                                <a th:href="@{/user/addresses}" class="btn btn-light border">Hủy</a>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="border-bottom py-3 d-flex gap-3 flex-wrap" th:each="a : ${addresses}">
                    <div class="flex-grow-1">
                        <strong th:text="${a.receiverName}"></strong> <span class="text-muted">| <span th:text="${a.phone}"></span></span>
                        <span class="badge bg-primary-soft text-primary ms-1" th:if="${a.defaultAddress}">Mặc định</span>
                        <div class="small text-muted" th:text="${a.fullAddress}"></div>
                    </div>
                    <div class="d-flex gap-1 align-items-start">
                        <a th:href="@{/user/addresses(edit=${a.id})}" class="btn btn-sm btn-light border">Sửa</a>
                        <form th:unless="${a.defaultAddress}" th:action="@{/user/addresses/{id}/default(id=${a.id})}" method="post">
                            <button class="btn btn-sm btn-light border">Đặt mặc định</button>
                        </form>
                        <form th:action="@{/user/addresses/{id}/delete(id=${a.id})}" method="post" data-confirm="Xóa địa chỉ này?">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </div>
                <div class="rb-empty" th:if="${#lists.isEmpty(addresses)}"><i class="bi bi-geo"></i><p>Chưa có địa chỉ nào</p></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
