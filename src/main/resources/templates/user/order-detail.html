<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title th:text="'Đơn hàng #' + ${order.code}">Đơn hàng</title></head>
<body>
<div layout:fragment="content" class="container">
    <div class="row g-4">
        <div class="col-lg-3"><div th:replace="~{fragments/user-nav :: nav}"></div></div>
        <div class="col-lg-9">
            <a th:href="@{/user/orders}" class="small"><i class="bi bi-arrow-left"></i> Quay lại đơn mua</a>
            <div th:replace="~{fragments/order-view :: view(${order}, 'user')}"></div>
            <div class="d-flex gap-2 justify-content-end mt-3">
                <a th:href="@{/user/chat(store=${order.store.id})}" class="btn btn-outline-primary"><i class="bi bi-chat-dots"></i> Liên hệ shop</a>
                <form th:if="${order.status.name() == 'NEW' or order.status.name() == 'CONFIRMED'}" th:action="@{/user/orders/{id}/cancel(id=${order.id})}"
                      method="post" data-confirm="Bạn chắc chắn muốn hủy đơn hàng này?">
                    <button class="btn btn-outline-danger">Hủy đơn hàng</button>
                </form>
                <form th:if="${order.status.name() == 'DELIVERED'}" th:action="@{/user/orders/{id}/return(id=${order.id})}"
                      method="post" data-confirm="Yêu cầu trả hàng và hoàn tiền cho đơn này?">
                    <button class="btn btn-outline-dark">Trả hàng / Hoàn tiền</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
