<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="pager(page)" th:if="${page.totalPages > 1}" class="mt-4">
    <ul class="pagination justify-content-center flex-wrap">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="${@fmt.pageUrl(page.number - 1)}"><i class="bi bi-chevron-left"></i></a>
        </li>
        <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <li class="page-item" th:if="${i == 0 or i == page.totalPages - 1 or (i >= page.number - 2 and i <= page.number + 2)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="${@fmt.pageUrl(i)}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item disabled" th:if="${(i == page.number - 3 and i > 0) or (i == page.number + 3 and i < page.totalPages - 1)}">
                <span class="page-link">…</span>
            </li>
        </th:block>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="${@fmt.pageUrl(page.number + 1)}"><i class="bi bi-chevron-right"></i></a>
        </li>
    </ul>
</nav>
</html>
