<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head><title>Trang chủ</title></head>
<body>
<div layout:fragment="content" class="container">
    <section class="rb-hero mb-4 py-4">
        <div class="col-lg-8 position-relative" style="z-index:2">
            <h1 class="h2">Xin chào, <span th:text="${currentUser.fullName}"></span>!</h1>
            <p class="opacity-75 mb-3">Hôm nay bạn muốn đọc gì? Dùng mã <strong class="text-warning">REBOOK10</strong> để giảm 10% cho đơn từ 100.000đ.</p>
            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/user/favorites}" class="btn btn-light btn-sm"><i class="bi bi-heart"></i> Yêu thích</a>
                <a th:href="@{/user/viewed}" class="btn btn-light btn-sm"><i class="bi bi-clock-history"></i> Đã xem</a>
                <a th:href="@{/user/orders}" class="btn btn-light btn-sm"><i class="bi bi-receipt"></i> Đơn mua</a>
            </div>
        </div>
        <div class="rb-hero-books d-flex">
            <span style="height:110px;background:#d9a441"></span><span style="height:140px;background:#f4e6dc"></span>
            <span style="height:125px;background:#2f5d62"></span><span style="height:150px;background:#c0392b"></span>
        </div>
    </section>

    <section class="mb-4">
        <div class="row row-cols-4 row-cols-md-8 g-2">
            <div class="col" th:each="c : ${navCategories}">
                <a class="rb-cat-tile py-2" th:href="@{/category/{s}(s=${c.slug})}"><i class="bi" th:classappend="${c.icon}"></i><span class="small" th:text="${c.name}"></span></a>
            </div>
        </div>
    </section>

    <section>
        <ul class="nav nav-pills mb-3 gap-2 flex-nowrap overflow-auto pb-1">
            <li class="nav-item" th:each="t : ${tabs}">
                <a class="nav-link rb-card px-3 text-nowrap" th:classappend="${t == tab} ? 'active'"
                   th:href="@{/(tab=${t})}" th:text="${tabNames.get(t)}"></a>
            </li>
        </ul>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
            <div class="col" th:each="p : ${page.content}">
                <div th:replace="~{fragments/product-card :: card(${p})}"></div>
            </div>
        </div>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
    </section>
</div>
</body>
</html>
