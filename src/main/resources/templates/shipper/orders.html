<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/dashboard}">
<head><title>Đơn được phân công</title></head>
<body>
<h1 layout:fragment="page-title" class="h5 mb-0 font-serif">Đơn được phân công</h1>
<div layout:fragment="content">
    <div class="rb-card mb-3 overflow-auto">
        <ul class="nav nav-underline px-3 flex-nowrap">
            <li class="nav-item"><a class="nav-link text-nowrap" th:classappend="${status == null} ? 'active'" th:href="@{/shipper/orders}">Tất cả</a></li>
            <li class="nav-item" th:each="s : ${statuses}">
                <a class="nav-link text-nowrap" th:classappend="${status == s} ? 'active'" th:href="@{/shipper/orders(status=${s})}"
                   th:text="${s.name() == 'CONFIRMED'} ? 'Chờ lấy hàng' : (${s.name() == 'CANCELLED'} ? 'Giao thất bại / Hủy' : ${s.label})"></a>
            </li>
        </ul>
    </div>
    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="o : ${page.content}">
            <div class="rb-card p-3 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between mb-2">
                    <strong th:text="'#' + ${o.code}"></strong>
                    <span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}"></span>
                </div>
                <div class="small"><i class="bi bi-shop text-primary"></i> <span th:text="${o.store.name}"></span></div>
                <div class="small text-muted mb-2"><i class="bi bi-geo"></i> <span th:text="${o.store.address}"></span></div>
                <div class="small"><i class="bi bi-person text-primary"></i> <span th:text="${o.receiverName} + ' · ' + ${o.receiverPhone}"></span></div>
                <div class="small text-muted mb-2"><i class="bi bi-geo-alt"></i> <span th:text="${o.shippingAddress}"></span></div>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                    <span class="small"><span th:text="${o.paymentMethod.name() == 'COD' and o.paymentStatus.name() == 'UNPAID'} ? 'Thu hộ:' : 'Đã thanh toán:'"></span>
                        <strong class="text-primary" th:text="${@fmt.money(o.total)}"></strong></span>
                    <a th:href="@{/shipper/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a>
                </div>
            </div>
        </div>
    </div>
    <div class="rb-empty rb-card" th:if="${page.totalElements == 0}"><i class="bi bi-box-seam"></i><p>Không có đơn hàng</p></div>
    <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
</div>
</body>
</html>
