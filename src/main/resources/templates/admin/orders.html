<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/dashboard}">
<head><title>Đơn hàng hệ thống</title></head>
<body>
<h1 layout:fragment="page-title" class="h5 mb-0 font-serif">Đơn hàng toàn hệ thống</h1>
<div layout:fragment="content">
    <form class="d-flex gap-2 mb-3 flex-wrap" method="get">
        <input type="search" name="q" class="form-control form-control-sm" style="width:220px" placeholder="Mã đơn, người nhận" th:value="${q}">
        <select name="storeId" class="form-select form-select-sm" style="width:220px">
            <option value="">Tất cả cửa hàng</option>
            <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name}" th:selected="${storeId == s.id}"></option>
        </select>
        <select name="status" class="form-select form-select-sm" style="width:180px">
            <option value="">Mọi trạng thái</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${status == s}"></option>
        </select>
        <button class="btn btn-sm btn-primary">Lọc</button>
    </form>
    <div class="rb-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead><tr><th>Mã đơn</th><th>Cửa hàng</th><th>Khách hàng</th><th>Ngày đặt</th><th>Shipper</th><th class="text-end">Tổng</th><th>Trạng thái</th></tr></thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" class="fw-semibold" th:text="'#' + ${o.code}"></a></td>
                    <td th:text="${o.store.name}"></td>
                    <td th:text="${o.receiverName}"></td>
                    <td th:text="${@fmt.dateTime(o.createdAt)}"></td>
                    <td th:text="${o.shipper != null} ? ${o.shipper.fullName} : '—'"></td>
                    <td class="text-end" th:text="${@fmt.money(o.total)}"></td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
</div>
</body>
</html>
