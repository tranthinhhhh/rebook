<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/dashboard}">
<head><title>Nhà vận chuyển</title></head>
<body>
<h1 layout:fragment="page-title" class="h5 mb-0 font-serif">Quản lý nhà vận chuyển</h1>
<div layout:fragment="content">
    <div class="row g-3">
        <div class="col-lg-4">
            <div class="rb-card p-3">
                <h2 class="h6 fw-bold" th:text="${form.id == null} ? 'Thêm nhà vận chuyển' : 'Sửa nhà vận chuyển'"></h2>
                <form th:action="@{/admin/carriers/save}" th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label small">Tên nhà vận chuyển</label>
                        <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Phí vận chuyển (đ)</label>
                        <input type="number" step="1000" class="form-control" th:field="*{fee}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fee}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Thời gian dự kiến</label>
                        <input class="form-control" th:field="*{estimatedTime}" placeholder="2-3 ngày">
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="cActive">
                        <label class="form-check-label small" for="cActive">Đang hoạt động</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">Lưu</button>
                        <a th:if="${form.id != null}" th:href="@{/admin/carriers}" class="btn btn-light border">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="rb-card">
                <table class="table table-hover align-middle mb-0 small">
                    <thead><tr><th>Nhà vận chuyển</th><th class="text-end">Phí</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${carriers}">
                        <td class="fw-semibold"><i class="bi bi-truck text-primary me-1"></i> <span th:text="${c.name}"></span></td>
                        <td class="text-end" th:text="${@fmt.money(c.fee)}"></td>
                        <td th:text="${c.estimatedTime}"></td>
                        <td><span class="badge" th:classappend="${c.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${c.active} ? 'Hoạt động' : 'Tạm ngừng'"></span></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/admin/carriers(edit=${c.id})}" class="btn btn-sm btn-light border"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/carriers/{id}/delete(id=${c.id})}" method="post" class="d-inline" data-confirm="Xóa nhà vận chuyển này?">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
