<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/dashboard}">
<head><title>Tổng quan hệ thống</title></head>
<body>
<h1 layout:fragment="page-title" class="h5 mb-0 font-serif">Tổng quan hệ thống</h1>
<div layout:fragment="content">
    <div class="row g-3 mb-3">
        <div class="col-sm-6 col-xl-3"><div class="rb-card rb-stat"><div class="icon bg-primary-soft text-primary"><i class="bi bi-cash-coin"></i></div>
            <div><div class="value" th:text="${@fmt.money(summary.gmv)}"></div><div class="label">Tổng giá trị đơn đã giao</div></div></div></div>
        <div class="col-sm-6 col-xl-3"><div class="rb-card rb-stat"><div class="icon" style="background:#fdf3e1;color:#b7862c"><i class="bi bi-percent"></i></div>
            <div><div class="value" th:text="${@fmt.money(summary.commission)}"></div><div class="label">Chiết khấu app thu được</div></div></div></div>
        <div class="col-sm-6 col-xl-3"><a th:href="@{/admin/users}" class="rb-card rb-stat text-dark"><div class="icon" style="background:#e3eefc;color:#2f6fd0"><i class="bi bi-people"></i></div>
            <div><div class="value" th:text="${summary.users}"></div><div class="label">Khách hàng & người bán</div></div></a></div>
        <div class="col-sm-6 col-xl-3"><a th:href="@{/admin/stores(status='PENDING')}" class="rb-card rb-stat text-dark"><div class="icon" style="background:#e4f2e6;color:#3d6b3a"><i class="bi bi-shop"></i></div>
            <div><div class="value"><span th:text="${summary.stores}"></span> <small class="fs-6 text-warning" th:if="${summary.pendingStores > 0}" th:text="'+' + ${summary.pendingStores} + ' chờ duyệt'"></small></div>
                <div class="label">Cửa hàng hoạt động</div></div></a></div>
    </div>
    <div class="rb-card p-3 mb-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h2 class="h6 fw-bold mb-0">Doanh thu toàn hệ thống</h2>
            <div class="btn-group btn-group-sm">
                <a th:each="p : ${ {'day','month','year'} }" th:href="@{/admin(period=${p})}" class="btn btn-outline-primary"
                   th:classappend="${period == p} ? 'active'" th:text="${p == 'day'} ? 'Theo ngày' : (${p == 'month'} ? 'Theo tháng' : 'Theo năm')"></a>
            </div>
        </div>
        <div style="height:300px"><canvas id="revChart"></canvas></div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-lg-6"><div class="rb-card p-3 h-100"><h2 class="h6 fw-bold">Người dùng mới</h2><div style="height:240px"><canvas id="userChart"></canvas></div></div></div>
        <div class="col-lg-6"><div class="rb-card p-3 h-100"><h2 class="h6 fw-bold">Cửa hàng mới</h2><div style="height:240px"><canvas id="storeChart"></canvas></div></div></div>
    </div>
    <div class="rb-card">
        <div class="p-3 d-flex justify-content-between"><h2 class="h6 fw-bold mb-0">Đơn hàng mới nhất</h2><a th:href="@{/admin/orders}" class="small">Xem tất cả</a></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead><tr><th>Mã đơn</th><th>Cửa hàng</th><th>Khách hàng</th><th>Ngày đặt</th><th class="text-end">Tổng</th><th>Trạng thái</th></tr></thead>
                <tbody><tr th:each="o : ${recentOrders}">
                    <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="'#' + ${o.code}"></a></td>
                    <td th:text="${o.store.name}"></td><td th:text="${o.receiverName}"></td>
                    <td th:text="${@fmt.dateTime(o.createdAt)}"></td><td class="text-end" th:text="${@fmt.money(o.total)}"></td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${o.status.color}" th:text="${o.status.label}"></span></td>
                </tr></tbody>
            </table>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <th:block th:replace="~{fragments/chart :: render('revChart', ${revenue}, ${period == 'day'} ? 'line' : 'bar', 'Doanh thu', true)}"></th:block>
    <th:block th:replace="~{fragments/chart :: render('userChart', ${newUsers}, 'line', 'Người dùng mới', false)}"></th:block>
    <th:block th:replace="~{fragments/chart :: render('storeChart', ${newStores}, 'bar', 'Cửa hàng mới', false)}"></th:block>
</th:block>
</body>
</html>
