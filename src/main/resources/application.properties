spring.application.name=ReBook
server.port=8080

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/rebook?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=rebook
spring.datasource.password=rebook123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===== Upload =====
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

# ===== JWT =====
app.jwt.secret=UmVCb29rLUhDTVVURS1XRVBSMzMwNDc5LU5ob20xNy1TZWNyZXQtS2V5LTIwMjY=
app.jwt.expiration-ms=604800000
app.jwt.cookie-name=ACCESS_TOKEN

# ===== Mail (Gmail SMTP) - để trống thì OTP sẽ in ra console =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.otp.expire-minutes=5

# ===== Cloudinary - để trống thì lưu file vào thư mục uploads =====
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===== VNPay sandbox - đăng ký tại https://sandbox.vnpayment.vn/devreg =====
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.vnpay.return-url=http://localhost:8080/payment/vnpay-return

# ===== Nghiệp vụ =====
app.default-commission-rate=5
app.seed-data=true
